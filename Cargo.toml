[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
twof-core = { path = "crates/core" }
twof-server = { path = "crates/server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
hex = "0.4"
subtle = "2"
thiserror = "2"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rust_decimal = { version = "1", default-features = false, features = ["std", "serde-str"] }

[profile.release]
overflow-checks = true
