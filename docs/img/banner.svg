<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="2F: second factor for API transactions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1216"/>
      <stop offset="1" stop-color="#1a2233"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect x="72" y="92" width="148" height="116" rx="22" fill="none" stroke="#eef1f5" stroke-width="8"/>
  <text x="146" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#eef1f5">2F</text>
  <text x="268" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#eef1f5">Second factor for API transactions</text>
  <text x="268" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#9aa4b2">Rules decide. People and machines sign the exact action.</text>
  <text x="268" y="226" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#9aa4b2">Your system executes only with a signed, single use receipt.</text>
  <g font-family="Consolas, Menlo, monospace" font-size="17" fill="#7da2ff">
    <text x="870" y="262">Ed25519 · WebAuthn · SHA-256</text>
  </g>
</svg>
